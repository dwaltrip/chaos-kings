<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimalist Tactical – Generals v2 UI Concept</title>
  <style>
    :root {
      --bg: #0f1113;
      --panel: #15181b;
      --line: #22262b;
      --card: #171a1e;
      --text: #e7ebef;
      --muted: #9aa3ad;
      --accent: #cfd6e1;
    }
    * { box-sizing: border-box }
    html, body { height: 100% }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans";
      color: var(--text);
      background: var(--bg);
    }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh }
    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 16px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .brand { font-weight: 700; letter-spacing: .02em }
    .nav { display: grid; gap: 8px; margin-top: 6px }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 6px;
      background: transparent; color: var(--text);
      border: 1px solid var(--line);
      cursor: pointer; text-align: left;
      transition: background .12s ease, border-color .12s ease;
    }
    .nav-btn:hover { background: #1a1d22; border-color: #2a2f36 }
    .nav-btn.active { background: #1a1d22; border-color: #343a43 }
    .muted { color: var(--muted) }
    .main { padding: 24px 24px 40px }
    .page-title { font-size: 18px; margin: 0 0 14px }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px }
    .btn {
      padding: 10px 12px; border-radius: 6px;
      background: #171a1e; color: var(--text);
      border: 1px solid var(--line);
      cursor: pointer; letter-spacing: .02em;
    }
    .btn:focus { outline: none; border-color: #3a414b }
    .btn:hover { border-color: #353b44 }
    .btn.primary { background: #1b2026; border-color: #3a414b }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 14px;
    }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px }
    .meta-tile {
      background: #14171b; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
    }
    .meta-label {
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .meta-value { font-size: 16px; margin-top: 4px }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Generals v2</div>
      <nav class="nav" aria-label="Primary">
        <button class="nav-btn active">🏠 <span>Dashboard</span></button>
        <button class="nav-btn">🎮 <span>Play</span></button>
        <button class="nav-btn">🧭 <span>Queue</span></button>
        <button class="nav-btn">🕑 <span>History</span></button>
        <button class="nav-btn">⚙️ <span>Settings</span></button>
      </nav>
      <div style="margin-top:auto" class="muted">v0.2 prototype</div>
    </aside>

    <main class="main">
      <h1 class="page-title">Dashboard</h1>
      <div class="toolbar">
        <button class="btn primary">Start Queue</button>
        <button class="btn">Create Custom</button>
        <button class="btn">Invite Friend</button>
      </div>

      <section class="grid">
        <div class="card">
          <div class="meta-label">Player</div>
          <div class="meta-value">Daniel • @dan</div>
          <div class="meta-grid">
            <div class="meta-tile">
              <div class="meta-label">ELO</div>
              <div class="meta-value">1473</div>
            </div>
            <div class="meta-tile">
              <div class="meta-label">Winrate</div>
              <div class="meta-value">58%</div>
            </div>
            <div class="meta-tile">
              <div class="meta-label">Games</div>
              <div class="meta-value">122</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="meta-label">Queue</div>
          <div class="meta-value">Idle</div>
          <div class="meta-grid">
            <div class="meta-tile">
              <div class="meta-label">Mode</div>
              <div class="meta-value">1v1</div>
            </div>
            <div class="meta-tile">
              <div class="meta-label">Region</div>
              <div class="meta-value">NA-East</div>
            </div>
            <div class="meta-tile">
              <div class="meta-label">ETA</div>
              <div class="meta-value">—</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="meta-label">Recent</div>
          <div class="meta-value">Last 3 Matches</div>
          <ul style="padding-left: 16px; margin: 8px 0 0">
            <li>W • 1v1 • 10:22</li>
            <li>L • 1v1 • 08:47</li>
            <li>W • 1v1 • 12:03</li>
          </ul>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
